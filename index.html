<!DOCTYPE html>
<html>
<head>
  <title>Voice Agent Test</title>
</head>
<div id="logs" style="
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  max-height: 200px;
  overflow: auto;
  background: black;
  color: lime;
  font-size: 12px;
  z-index: 9999;
  padding: 5px;
"></div>
<body>
  <h2>🎤 Voice Agent Test</h2>

  <button onclick="start()">Start</button>
  <button onclick="stop()">Stop</button>

  <p><b>User:</b> <span id="user"></span></p>
  <p><b>AI:</b> <span id="ai"></span></p>

  <script>

    function log(msg) {
      console.log(msg);

      const el = document.getElementById("logs");
      if (el) {
        el.innerHTML += msg + "<br>";
        el.scrollTop = el.scrollHeight;
      }
    }
    let ws;
    let audioContext;
    let processor;
    let stream;

    let queue = [];
    let isPlaying = false;

    // -----------------------------------
    // CONNECT WS
    // -----------------------------------
    function connect() {
      ws = new WebSocket("wss://candyai-voiceagent.onrender.com/voice");
      ws.binaryType = "arraybuffer";

      ws.onopen = () => {
        log("✅ Connected");

        ws.send(JSON.stringify({
          user_id: "test_user",
          character_id: "69afc5a36b69a290cae6969e"
        }));
      };

      ws.onmessage = async (event) => {
        if (typeof event.data === "string") {
          const data = JSON.parse(event.data);

          if (data.type === "transcript") {
            document.getElementById("user").innerText = data.text;
          }

          if (data.type === "ai_text") {
            document.getElementById("ai").innerText = data.text;
          }

        } else {
          enqueueAudio(new Blob([event.data], { type: "audio/mpeg" }));
        }
      };
    }

    // -----------------------------------
    // AUDIO PLAYBACK (SMOOTH)
    // -----------------------------------
    function enqueueAudio(chunk) {
      queue.push(chunk);
      if (!isPlaying) playQueue();
    }

    async function playQueue() {
      if (!audioContext) {
        audioContext = new AudioContext();
      }

      isPlaying = true;

      while (queue.length > 0) {
        const chunk = queue.shift();

        const arrayBuffer = await chunk.arrayBuffer();
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

        const source = audioContext.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioContext.destination);
        source.start();

        await new Promise(res => source.onended = res);
      }

      isPlaying = false;
    }

    // -----------------------------------
    // START MIC
    // -----------------------------------
    async function start() {
  try {
    log("🚀 Start clicked");

    // 🎤 GET MIC FIRST
    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        sampleRate: 16000,
        echoCancellation: true,
        noiseSuppression: true,
      },
    });

    log("🎤 Mic permission granted");

    // 🔌 CONNECT WS
    connect();

    await new Promise((resolve) => {
      const check = setInterval(() => {
        if (ws && ws.readyState === 1) {
          clearInterval(check);
          resolve();
        }
      }, 50);
    });

    log("🔌 WS ready");

    // 🎧 AUDIO CONTEXT
    audioContext = new (window.AudioContext || window.webkitAudioContext)({
      sampleRate: 16000,
    });

    log("🎧 AudioContext state: " + audioContext.state);

    // 🔥 iOS FIX
    if (audioContext.state === "suspended") {
      await audioContext.resume();
      log("🔊 AudioContext resumed");
    }

    const source = audioContext.createMediaStreamSource(stream);

    processor = audioContext.createScriptProcessor(4096, 1, 1);

    source.connect(processor);
    processor.connect(audioContext.destination);

    // 🎤 STREAM AUDIO
    processor.onaudioprocess = (e) => {
      try {
        if (!ws || ws.readyState !== 1) {
          log("⚠️ WS not ready");
          return;
        }

        const input = e.inputBuffer.getChannelData(0);

        log("🎤 Sending audio: " + input.length);

        const buffer = new ArrayBuffer(input.length * 2);
        const view = new DataView(buffer);

        for (let i = 0; i < input.length; i++) {
          let s = Math.max(-1, Math.min(1, input[i]));
          view.setInt16(i * 2, s * 0x7fff, true);
        }

        ws.send(buffer);

      } catch (err) {
        log("❌ Audio error: " + err.message);
      }
    };

    log("🎤 Recording started");

  } catch (err) {
    log("❌ Start error: " + err.message);
  }
}

    // -----------------------------------
    // STOP
    // -----------------------------------
    function stop() {
  try {
    processor?.disconnect();
    stream?.getTracks().forEach(track => track.stop());
    audioContext?.close();
    ws?.close();

    console.log("🛑 Stopped");
  } catch (err) {
    console.error("Stop error:", err);
  }
}
  </script>
</body>
</html>
