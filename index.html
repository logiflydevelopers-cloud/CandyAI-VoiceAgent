<!DOCTYPE html>
<html>
<head>
  <title>Voice Agent Test</title>
</head>

<div id="logs" style="
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  max-height: 1000px;
  overflow: auto;
  background: black;
  color: lime;
  font-size: 12px;
  z-index: 9999;
  padding: 5px;
"></div>

<body>
  <h2>🎤 Voice Agent Test</h2>

  <button onclick="start()">Start</button>
  <button onclick="stop()">Stop</button>

  <p><b>User:</b> <span id="user"></span></p>
  <p><b>AI:</b> <span id="ai"></span></p>

<script>
function log(msg) {
  console.log(msg);
  const el = document.getElementById("logs");
  if (el) {
    el.innerHTML += msg + "<br>";
    el.scrollTop = el.scrollHeight;
  }
}

let ws;
let stream;
let recorder;
let audioContext;

let queue = [];
let isPlaying = false;

// -----------------------------------
// CONNECT WS
// -----------------------------------
function connect() {
  ws = new WebSocket("wss://candyai-voiceagent.onrender.com/voice");
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    log("✅ WS Connected");

    ws.send(JSON.stringify({
      user_id: "test_user",
      character_id: "69afc5a36b69a290cae6969e"
    }));
  };

  ws.onmessage = async (event) => {
    if (typeof event.data === "string") {
      const data = JSON.parse(event.data);

      if (data.type === "transcript") {
        document.getElementById("user").innerText = data.text;
      }

      if (data.type === "ai_text") {
        document.getElementById("ai").innerText = data.text;
      }

    } else {
      enqueueAudio(new Blob([event.data], { type: "audio/mpeg" }));
    }
  };

  ws.onclose = (e) => log("❌ WS Closed: " + e.code);
  ws.onerror = () => log("❌ WS Error");
}

// -----------------------------------
// AUDIO PLAYBACK
// -----------------------------------
function enqueueAudio(chunk) {
  queue.push(chunk);
  if (!isPlaying) playQueue();
}

async function playQueue() {
  if (!audioContext) {
    audioContext = new AudioContext();
  }

  isPlaying = true;

  while (queue.length > 0) {
    const chunk = queue.shift();

    const arrayBuffer = await chunk.arrayBuffer();
    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

    const source = audioContext.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(audioContext.destination);
    source.start();

    await new Promise(res => source.onended = res);
  }

  isPlaying = false;
}

// -----------------------------------
// START
// -----------------------------------
async function start() {
  try {
    log("🚀 Start clicked");

    // 🎤 1. Get mic FIRST
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    log("🎤 Mic ready");

    // 🔌 2. Connect WS
    connect();

    // wait for WS
    await new Promise((resolve) => {
      const check = setInterval(() => {
        if (ws && ws.readyState === 1) {
          clearInterval(check);
          resolve();
        }
      }, 50);
    });

    log("🔌 WS Ready");

    // 🎧 3. MediaRecorder (KEY FIX)
    recorder = new MediaRecorder(stream, {
      mimeType: "audio/webm;codecs=opus"
    });

    recorder.ondataavailable = async (event) => {
      if (event.data.size > 0 && ws.readyState === 1) {
        const buffer = await event.data.arrayBuffer();
        ws.send(buffer);

        log("🎤 Sent chunk: " + buffer.byteLength);
      }
    };

    recorder.start(250); // send every 250ms

    log("🎤 Recording started");

  } catch (err) {
    log("❌ Start error: " + err.message);
  }
}

// -----------------------------------
// STOP
// -----------------------------------
function stop() {
  try {
    recorder?.stop();
    stream?.getTracks().forEach(track => track.stop());
    ws?.close();
    audioContext?.close();

    log("🛑 Stopped");

  } catch (err) {
    log("❌ Stop error: " + err.message);
  }
}
</script>

</body>
</html>
