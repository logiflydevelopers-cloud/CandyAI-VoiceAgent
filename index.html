<!DOCTYPE html>
<html>
<head>
  <title>Voice Agent Test</title>
</head>

<div id="logs" style="
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  max-height: 1000px;
  overflow: auto;
  background: black;
  color: lime;
  font-size: 12px;
  z-index: 9999;
  padding: 5px;
"></div>

<body>
  <h2>🎤 Voice Agent Test</h2>

  <button onclick="start()">Start</button>
  <button onclick="stop()">Stop</button>

  <p><b>User:</b> <span id="user"></span></p>
  <p><b>AI:</b> <span id="ai"></span></p>

<script>
function log(msg) {
  console.log(msg);
  const el = document.getElementById("logs");
  if (el) {
    el.innerHTML += msg + "<br>";
    el.scrollTop = el.scrollHeight;
  }
}

let ws;
let stream;
let audioContext;
let workletNode;

let queue = [];
let isPlaying = false;

// -----------------------------------
// CONNECT WS
// -----------------------------------
function connect() {
  ws = new WebSocket("wss://candyai-voiceagent.onrender.com/voice");
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    log("✅ WS Connected");

    ws.send(JSON.stringify({
      user_id: "test_user",
      character_id: "69afc5a36b69a290cae6969e"
    }));
  };

  ws.onmessage = async (event) => {
    if (typeof event.data === "string") {
      const data = JSON.parse(event.data);

      if (data.type === "transcript") {
        document.getElementById("user").innerText = data.text;
      }

      if (data.type === "ai_text") {
        document.getElementById("ai").innerText = data.text;
      }

    } else {
      enqueueAudio(new Blob([event.data], { type: "audio/mpeg" }));
    }
  };

  ws.onclose = (e) => log("❌ WS Closed: " + e.code);
}

// -----------------------------------
// AUDIO PLAYBACK
// -----------------------------------
function enqueueAudio(chunk) {
  audioChunks.push(chunk);

  // 🔥 Start playback when enough data arrives
  if (!isPlaying && audioChunks.length >= 5) {
    playAudio();
  }
}

function playAudio() {
  if (audioChunks.length === 0) return;

  isPlaying = true;

  const blob = new Blob(audioChunks, { type: "audio/mpeg" });
  audioChunks = [];

  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);

  audio.play().catch(err => {
    console.error("❌ Audio play error:", err);
  });

  audio.onended = () => {
    URL.revokeObjectURL(url);
    isPlaying = false;

    // play next batch if available
    if (audioChunks.length > 0) {
      playAudio();
    }
  };
}
// -----------------------------------
// START
// -----------------------------------
async function start() {
  try {
    log("🚀 Start clicked");

    // 🎤 MIC
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    // 🔌 WS
    connect();

    await new Promise((resolve) => {
      const check = setInterval(() => {
        if (ws && ws.readyState === 1) {
          clearInterval(check);
          resolve();
        }
      }, 50);
    });

    log("🔌 WS Ready");

    // 🎧 AUDIO CONTEXT
    audioContext = new AudioContext({ sampleRate: 16000 });

    await audioContext.audioWorklet.addModule("processor.js");

    const source = audioContext.createMediaStreamSource(stream);

    workletNode = new AudioWorkletNode(audioContext, "pcm-processor");

    source.connect(workletNode);
    workletNode.connect(audioContext.destination);

    workletNode.port.onmessage = (event) => {
      if (ws.readyState === 1) {
        ws.send(event.data);
        log("🎤 Sent PCM: " + event.data.byteLength);
      }
    };

    log("🎤 PCM Streaming started");

  } catch (err) {
    log("❌ Error: " + err.message);
  }
}

// -----------------------------------
// STOP
// -----------------------------------
function stop() {
  try {
    workletNode?.disconnect();
    stream?.getTracks().forEach(track => track.stop());
    audioContext?.close();
    ws?.close();

    log("🛑 Stopped");

  } catch (err) {
    log("❌ Stop error: " + err.message);
  }
}
</script>
</body>
</html>
